# Same job as the Cloudflare Worker (worker/index.ts) and the Vercel middleware (middleware.ts):
# the app's files, and /api, /docs and /health forwarded to the API, so both share one address.

# Docker's DNS: "api" is looked up on every request, so nginx starts even before the API is up
# and follows the API container when it is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep https when the request came through Cloudflare Tunnel
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 20m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /api  { return 302 /api/v1; }
  location = /api/ { return 302 /api/v1; }

  location ~ ^/(api|docs|health)(/|$) {
    set $api http://api:3000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control no-store always;
    proxy_intercept_errors off;
    error_page 502 503 504 = @api_down;
  }

  location @api_down {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 502 '{"statusCode":502,"message":"The API server did not answer. Is the api container running?"}';
  }

  # The service worker must never be cached, or app updates are not picked up
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Built files have a hash in their name: cache them for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # App routes (/sales, /products, ...): refreshing the page loads the app. index.html is checked
  # on every visit so a new version shows at once.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
